<!DOCTYPE html>
<html lang="ur" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Basic Understanding of Quran – 1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@600&display=swap">
<style>
:root{--bg:#2c1563;--bg2:#2c1563;--card:#2f1366;--ink:#f3ecff;--mute:#b9a6dd;--gold:#f0c36a;--lav:#b794f6;--grn:#7adba0;--red:#ff8fa3;--ln:#4a2a8a;color-scheme:dark;box-sizing:border-box}
*{box-sizing:inherit}
html{height:100%;background:#2c1563}
body{margin:0;min-height:100%;min-height:100dvh;background:#2c1563;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.st{animation:tw 3s infinite alternate}@keyframes tw{from{opacity:.2}to{opacity:.9}}
#app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:14px 16px 60px}
.ar{font-family:Amiri,"Scheherazade New","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;font-size:1.25em;color:var(--gold)}
h1,h2{font-family:Cinzel,Georgia,serif;margin:.2em 0;line-height:1.2}
h1{font-size:clamp(24px,6vw,38px);color:var(--gold)}h2{font-size:clamp(20px,4.5vw,28px)}h3,h4{color:var(--lav);margin:1.2em 0 .4em}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.btn{font:inherit;font-weight:600;background:var(--gold);color:#2a0c55;border:0;border-radius:10px;padding:8px 16px;cursor:pointer}
.btn.o{background:#ffffff12;color:var(--ink);border:1px solid var(--ln)}
.btn:focus-visible,.chip:focus-visible,.tile:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
.hero{text-align:center;padding:18px 0 8px}.hero .ar{font-size:44px}.hero p{color:var(--mute);margin:.2em 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin-top:14px}
.tile{background:#2f1366cc;border:1px solid var(--ln);border-radius:14px;padding:14px;cursor:pointer;color:inherit;font:inherit;text-align:start;backdrop-filter:blur(3px)}
.tile:hover{border-color:var(--gold)}.tile b{color:var(--gold)}.tile small{color:var(--mute)}
.bar{height:6px;border-radius:9px;background:#ffffff18;margin-top:8px;overflow:hidden;display:flex}.bar i{display:block;height:100%}
.tabs{display:flex;gap:8px;margin:10px 0}.tabs .btn{flex:1}
.panel{background:#220a48d9;border:1px solid var(--ln);border-radius:14px;padding:4px 18px 18px;backdrop-filter:blur(3px)}
.panel ul,.panel ol{padding-left:0;padding-right:0;padding-inline-start:26px}.panel li{margin:.3em 0}
blockquote{margin:.8em 0;padding:6px 12px;border-left:0;border-inline-start:3px solid var(--gold);color:var(--mute)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;margin:.8em 0}
th,td{padding:6px 10px;border-bottom:1px solid var(--ln);text-align:start}th{color:var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{flex:none;background:#ffffff12;color:var(--ink);border:1px solid var(--ln);border-radius:99px;padding:4px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--lav);color:#1b0840;border-color:var(--lav)}
.stats{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin:4px 2px 10px}
.deck{position:relative;height:min(56vh,360px);touch-action:pan-y;margin:6px 0 14px}
.fc{position:absolute;inset:0;perspective:900px;user-select:none;touch-action:pan-y}
.fc.b{transform:scale(.95) translateY(12px);opacity:.6;pointer-events:none}.fc.b2{transform:scale(.9) translateY(24px);opacity:.3;pointer-events:none}
.in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}.fc.f .in{transform:rotateY(180deg)}
.fa{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:2px solid var(--gold);background:linear-gradient(160deg,#4a1d9c,#2a0f5c);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;box-shadow:0 12px 32px #0007;overflow:auto}
.fa.bk{transform:rotateY(180deg);background:linear-gradient(160deg,#2a0f5c,#4a1d9c);border-color:var(--lav)}
.fa .ar{font-size:clamp(36px,10vw,58px);line-height:1.5}.fa .en{font-size:clamp(20px,5vw,28px);font-weight:600}.fa small{position:absolute;top:10px;left:0;right:0;color:var(--mute)}
.tag{position:absolute;top:16px;font-weight:800;font-size:20px;border:3px solid;border-radius:10px;padding:2px 10px;opacity:0;z-index:3;transform:rotate(-8deg)}
.tag.l{left:16px;color:var(--grn)}.tag.r{right:16px;color:var(--red);transform:rotate(8deg)}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.acts .btn{flex:1;min-width:100px}
.dn{background:var(--grn)}.hd{background:var(--red)}.hint{text-align:center;color:var(--mute);font-size:13px;margin-top:8px}
.empty{text-align:center;padding:40px 10px}

html,body{overflow:hidden}
#app{position:fixed;inset:0;max-width:none;margin:0;padding:64px 16px 68px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.sl{width:100%;max-width:780px;margin:auto;animation:up .45s both}@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
#hd{position:fixed;top:0;left:0;right:0;z-index:5;padding:8px 16px 6px;background:linear-gradient(#13052af0,#13052a00)}
#hl{font-size:13px;color:var(--mute);display:flex;justify-content:space-between;gap:10px;margin-bottom:5px}#hl b{color:var(--gold)}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;gap:16px;padding:8px 10px}
#nav button{width:46px;height:46px;border-radius:50%;background:#ffffff14;color:var(--ink);border:1px solid var(--ln);font-size:22px;cursor:pointer}
#nav button:disabled{opacity:.25}#cn{color:var(--mute);min-width:70px;text-align:center}
.pulse{animation:pl 2.2s infinite}@keyframes pl{50%{box-shadow:0 0 0 8px #f0c36a00,0 0 22px #f0c36a66}}
.hero{text-align:center}.hero .ar{font-size:clamp(34px,9vw,64px);line-height:1.6}.hero h1{font-size:clamp(28px,7vw,52px);margin:.3em 0}
.deck{height:min(52vh,380px)}

#hd{position:fixed;top:0;left:0;right:0;z-index:7;padding:0;background:none}#hd .bar{margin:0;height:4px;border-radius:0}
#app{padding:78px 16px 80px}
#top{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:0;right:0;z-index:6;display:flex;justify-content:center;padding:0 10px;pointer-events:none}
#dd{position:relative;width:168px;border:1px solid #ffffff2e;border-radius:20px;background:#3a187866;-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);overflow:hidden;pointer-events:auto;box-shadow:inset 0 1px 0 #ffffff26;transition:width .4s cubic-bezier(.32,.72,0,1),background .3s,border-radius .4s,box-shadow .3s}
#dd.tp{width:min(236px,84vw)}
#dd.open{width:min(420px,92vw);border-radius:24px;background:#2a0f5cb8;-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);box-shadow:0 16px 44px #0009,inset 0 1px 0 #ffffff33}
#dbtn{direction:ltr;width:100%;height:38px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;background:none;color:var(--ink);border:0;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
#dlab{overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext;text-align:center}.chev{display:inline-block;transition:transform .4s cubic-bezier(.32,.72,0,1)}#dd.open .chev{transform:rotate(180deg)}
#dlist{display:flex;flex-direction:column;max-height:0;padding:0 6px;overflow-y:auto;visibility:hidden;transition:max-height .4s cubic-bezier(.32,.72,0,1),padding .4s,visibility 0s .4s}
#dd.open #dlist{max-height:min(62vh,420px);padding:0 6px 8px;visibility:visible;transition-delay:0s}
#dlist button{background:none;border:0;color:var(--ink);font:inherit;text-align:center;unicode-bidi:plaintext;padding:9px 14px;border-radius:14px;cursor:pointer;opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .35s cubic-bezier(.32,.72,0,1),background .15s}
#dd.open #dlist button{opacity:1;transform:none}#dlist button:hover{background:#ffffff18}#dlist button.on{color:var(--gold);font-weight:700;background:#ffffff10}
#dbtn:focus-visible,#dlist button:focus-visible{outline:2px solid var(--lav);outline-offset:-3px}
#nav{pointer-events:none;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px))}
#np{direction:ltr;pointer-events:auto;display:flex;align-items:center;gap:0;padding:4px;border:1px solid #ffffff2e;border-radius:99px;background:#3a187866;-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);box-shadow:none;width:204px;min-width:0}
#nav button{width:38px;height:38px;border:0;background:none;font-size:22px;color:var(--ink);cursor:pointer;border-radius:50%}#nav button:hover{background:#ffffff18}
#cn{min-width:110px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){#dd,#dlist,#dlist button,.chev{transition-duration:.01s!important}}

#np .sw{flex:1 1 0;min-width:0;height:38px;border:0;background:none;color:var(--ink);font:inherit;font-weight:600;font-size:13px;cursor:pointer;border-radius:99px;padding:0 4px;transition:background .2s,color .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#np .sw:hover{background:#ffffff18}
#np .sw.on{background:var(--lav);color:#1b0840}
#np .sw:focus-visible{outline:2px solid var(--lav);outline-offset:-2px}
.hero h1{font-size:clamp(24px,6.3vw,62px)!important;line-height:1.08!important;text-wrap:balance}

function cardH(q,n){const l=q.l,sec=l.s[q.c[0]];return `<div class="fc ${n?'b'+(n>1?'2':''):'top'}"><div class="in"><div class="fa"><small>${ud(esc(sec))}</small><span class="tag l">مکمل</span><span class="tag r">مشکل</span><div class="ar" lang="ar">${esc(q.c[1])}</div></div><div class="fa bk"><small>معنی</small><div class="en">${inl(q.c[2])}</div><div class="ar" lang="ar" style="font-size:28px;margin-top:10px;opacity:.8">${esc(q.c[1])}</div></div></div></div>`}
function act(v){const q=Q.shift();if(!q)return;const key=id(q.l,q.k);H.push({q,old:S[key]});if(view==='review'&&v==2)Q.push(q);else S[key]=v;save();refresh()}
function undo(){const h=H.pop();if(!h)return;const key=id(h.q.l,h.q.k);if(h.old)S[key]=h.old;else delete S[key];Q=Q.filter(x=>x!==h.q);Q.unshift(h.q);save();refresh()}
function wire(){const A=$('#app'),q=s=>A.querySelector(s);
A.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>goTo('topic',+b.dataset.topic,'notes'));
A.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>goTo('review'));
A.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{V.s=+b.dataset.sec;build();refresh()});
const nx=q('[data-nx]');if(nx)nx.onclick=()=>{if(topicI<D.L.length-1)goTo('topic',topicI+1,'cards');else goTo('syllabus')};
const rs=q('[data-rs]');if(rs)rs.onclick=()=>{if(confirm('تمام مکمل/مشکل نشانات صاف کریں؟')){S={};save();render()}};
const sh=q('[data-sh]');if(sh)sh.onclick=()=>{V.sh=!V.sh;build();refresh()};
const u=q('[data-undo]');if(u)u.onclick=undo;
const c=q('.fc.top');if(c)drag(c);
// switcher
$('#np').querySelectorAll('[data-sw]').forEach(b=>{b.onclick=()=>{const sw=b.dataset.sw;if(sw==='title')goTo('title');else if(sw==='syllabus')goTo('syllabus');else if(sw==='notes'){sub='notes';save();render()}else if(sw==='cards'){sub='cards';build();save();render()}else if(sw==='review')goTo('review')}})}
function fly(v){const c=$('.fc.top');if(!c)return act(v);c.style.transition='transform .3s,opacity .3s';c.style.transform=`translateX(${v==1?-130:130}%) rotate(${v==1?-18:18}deg)`;c.style.opacity=0;setTimeout(()=>act(v),260)}
function drag(c){let x0=null,dx=0;const tl=c.querySelector('.tag.l'),tr=c.querySelector('.tag.r');
c.onpointerdown=e=>{x0=e.clientX;dx=0;c.setPointerCapture(e.pointerId);c.style.transition='none'};
c.onpointermove=e=>{if(x0==null)return;dx=e.clientX-x0;c.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;tl.style.opacity=dx<0?Math.min(1,-dx/90):0;tr.style.opacity=dx>0?Math.min(1,dx/90):0};
c.onpointerup=c.onpointercancel=()=>{if(x0==null)return;const d=dx;x0=null;if(Math.abs(d)>90)fly(d<0?1:2);else if(Math.abs(d)<6){c.style.transition='';c.style.transform='';c.classList.toggle('f')}else{c.style.transition='transform .25s';c.style.transform='';tl.style.opacity=tr.style.opacity=0}}}
$('#dbtn').onclick=e=>{e.stopPropagation();const o=$('#dd').classList.toggle('open');$('#dbtn').setAttribute('aria-expanded',o)};
document.addEventListener('click',e=>{if(!e.target.closest('#dd')){$('#dd').classList.remove('open');$('#dbtn').setAttribute('aria-expanded','false')}});
document.addEventListener('keydown',e=>{if(e.key=='Escape')return $('#dd').classList.remove('open');const c=$('.fc.top');let vis=false;if(c){const r=c.getBoundingClientRect();vis=r.top<innerHeight*.75&&r.bottom>innerHeight*.25}
if(vis){if(e.key=='ArrowLeft')return fly(1);if(e.key=='ArrowRight')return fly(2);if(e.key==' '){e.preventDefault();return c.classList.toggle('f')}return}});
if((view==='topic'&&sub==='cards')||view==='review')build();
render();

</script></body></html>
