<title>Applications of ICT – Exam Notes</title>
<style>

*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:clamp(14px,1.5vw,18px)/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#bg{position:fixed;inset:0;z-index:0;background:

radial-gradient(50vmax 40vmax at -10% 100%,rgba(10,165,196,.09),transparent 60%),
linear-gradient(rgba(21,102,214,.035) 1px,transparent 1px) 0 0/32px 32px,
linear-gradient(90deg,rgba(21,102,214,.035) 1px,transparent 1px) 0 0/32px 32px,
linear-gradient(180deg,#f2f8ff,#e4effc)}
#bg svg{position:absolute;inset:0;width:100%;height:100%}
#bg path{fill:none;stroke:#1566d6;stroke-opacity:.09;stroke-width:1.5}
#bg circle{fill:#fff;stroke:#1566d6;stroke-opacity:.2;stroke-width:1.5}
#bg .p{stroke:#0aa5c4;stroke-opacity:.28;stroke-dasharray:6 140;stroke-width:2;animation:flow 6s linear infinite}
#bg .p:nth-of-type(even){animation-duration:9s;animation-delay:-3s}
@keyframes flow{to{stroke-dashoffset:-146}}
#bar{position:fixed;top:0;left:0;height:4px;background:var(--ac);width:0;transition:width .4s;z-index:6}
.s{position:fixed;inset:0;padding:78px 5vw 40px;visibility:hidden;opacity:0;transition:opacity .35s,visibility .35s;overflow-y:auto;z-index:1;touch-action:pan-y pinch-zoom}
.s.on{visibility:visible;opacity:1}
.s.pk{visibility:visible;opacity:1}
.in{max-width:840px;margin:0 auto}
.lec{font:600 .8em ui-monospace,Consolas,monospace;color:var(--cy);margin:0 0 4px}
h1{font:700 clamp(28px,4.6vw,48px)/1.1 Georgia,"Times New Roman",serif;margin:0 0 16px;display:inline-block;border-bottom:3px solid var(--ac);padding-bottom:6px}
h2{font-size:1.1em;margin:22px 0 8px;color:var(--ac)}
p{margin:0 0 10px}
.a{opacity:0;transform:translateY(24px)}
.on .a{animation:up .6s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0)*.09s + .15s)}
@keyframes up{to{opacity:1;transform:none}}
.s.pk .a,body.sw .on .a{opacity:1;transform:none;animation:none}
.box{background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 14px;box-shadow:0 4px 18px rgba(21,102,214,.1)}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92em}
th{text-align:left;background:var(--hi);color:var(--ac);font-weight:700}
th,td{padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:nth-child(even) td{background:rgba(220,236,255,.45)}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600;white-space:nowrap}
.n td:first-child{white-space:normal}
ul{margin:0 0 12px;padding-left:20px}li{margin:3px 0}
code{font-family:ui-monospace,Consolas,monospace;background:var(--hi);color:var(--ac);padding:1px 7px;border-radius:6px}
.note{border-left:4px solid var(--cy);background:rgba(255,255,255,.96);padding:10px 14px;border-radius:0 12px 12px 0;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chips b{background:var(--ac);color:#fff;font-weight:600;padding:5px 12px;border-radius:16px;font-size:.9em}
.cv{display:flex;flex-direction:column}.cv .in{margin:auto;width:100%;text-align:center}.cv{padding-top:12vh;padding-bottom:12vh}.cv .k{color:var(--ac);font-weight:600;margin:0 0 .6em}.cv h1{display:block;font-size:clamp(34px,7vw,88px);line-height:1.08;border-bottom:0;padding-bottom:0;margin:0 0 .4em}.cv .sub{font-size:1.25em;color:var(--mute);margin:0 0 22px}.cv .chips b{background:rgba(255,255,255,.96);color:var(--ac);border:1px solid var(--line)}.cv .tag{display:inline-block;font:600 .85em ui-monospace,Consolas,monospace;color:#fff;background:var(--ac);padding:4px 12px;border-radius:14px;margin-bottom:16px}
.hint{text-align:center;color:var(--mute);font-size:.8em;margin-top:22px}
#top{position:fixed;top:4px;left:0;right:0;z-index:5;display:flex;justify-content:center;padding:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));pointer-events:none}
#dd{position:relative;width:168px;border:1px solid rgba(21,102,214,.35);border-radius:19px;background:rgba(247,251,255,.78);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);overflow:hidden;pointer-events:auto;box-shadow:0 4px 16px rgba(21,102,214,.18);transition:width .4s cubic-bezier(.32,.72,0,1),border-radius .4s,box-shadow .3s}
#dd.open{width:min(400px,92vw);border-radius:22px;box-shadow:0 14px 40px rgba(13,37,64,.28)}
#dbtn{width:100%;height:36px;display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;color:var(--ac);border:0;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap;padding:0 12px}
#dlab{overflow:hidden;text-overflow:ellipsis;max-width:150px}
#dcnt{color:var(--mute);font-weight:600;font-variant-numeric:tabular-nums;padding-left:8px;border-left:1px solid rgba(21,102,214,.35);line-height:1.1}
#dbtn .ar{display:inline-block;transition:transform .4s cubic-bezier(.32,.72,0,1)}
#dd.open #dbtn .ar{transform:rotate(180deg)}
#dbtn:focus-visible,#dlist button:focus-visible{outline:2px solid var(--ac);outline-offset:-3px}
#dlist{display:flex;flex-direction:column;max-height:0;padding:0 6px;visibility:hidden;overflow-y:auto;transition:max-height .4s cubic-bezier(.32,.72,0,1),padding .4s,visibility 0s .4s}
#dd.open #dlist{max-height:min(380px,60vh);padding:0 6px 8px;visibility:visible;transition-delay:0s}
#dlist button{background:none;border:0;color:var(--ink);font:inherit;text-align:left;white-space:nowrap;padding:8px 14px;border-radius:14px;cursor:pointer;opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .35s cubic-bezier(.32,.72,0,1),background .15s}
#dd.open #dlist button{opacity:1;transform:none;transition-delay:calc(var(--d)*.03s + .04s)}
#dlist button:hover{background:rgba(21,102,214,.1)}
#dlist button.on{color:var(--ac);font-weight:700;background:rgba(21,102,214,.1)}

let i=0,swp=false;
S.forEach((s,k)=>{const b=document.createElement('button');b.type='button';b.setAttribute('role','option');b.style.setProperty('--d',k);b.textContent=(k+1)+'. '+s.t;b.onclick=()=>{go(k);cl()};dl.appendChild(b)});
function go(n){i=Math.max(0,Math.min(S.length-1,n));Sl.forEach((s,k)=>s.classList.toggle('on',k===i));document.getElementById('dlab').textContent=S[i].t;document.getElementById('dcnt').textContent=(i+1)+' / '+S.length;bar.style.width=((i+1)/S.length*100)+'%';[].forEach.call(dl.children,(b,k)=>b.classList.toggle('on',k===i));document.body.classList.toggle('sw',swp);Sl[i].scrollTop=0}
function cl(){dd.classList.remove('open');dbtn.setAttribute('aria-expanded','false')}
dbtn.onclick=e=>{e.stopPropagation();const o=!dd.classList.contains('open');dd.classList.toggle('open',o);dbtn.setAttribute('aria-expanded',String(o))};
document.addEventListener('click',e=>{if(!dd.contains(e.target))cl()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')cl();else if(['ArrowRight','PageDown'].includes(e.key))go(i+1);else if(['ArrowLeft','PageUp'].includes(e.key))go(i-1)});
let tx=0,ty=0,dx=0,dg=0,md=0,sk=0,t0=0,W=0,cu=null,pk=null,busy=false;
function hide(x){x.style.transition='none';x.style.transform='';x.classList.remove('pk');x.style.visibility='hidden';x.style.opacity='0';requestAnimationFrame(()=>requestAnimationFrame(()=>{x.style.transition='';x.style.visibility='';x.style.opacity=''}))}
function fin(c,n,k){swp=true;go(k);swp=false;hide(c);n.style.transition='none';n.style.transform='';n.classList.remove('pk');requestAnimationFrame(()=>requestAnimationFrame(()=>{n.style.transition=''}))}
document.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;dx=0;dg=0;t0=Date.now();md=busy?0:(e.touches.length>1||e.target.closest('#dd'))?0:1},{passive:true});
document.addEventListener('touchmove',e=>{if(md!==1)return;const t=e.touches[0],x=t.clientX-tx,y=t.clientY-ty;
if(!dg){if(Math.abs(x)<8&&Math.abs(y)<8)return;if(Math.abs(y)>Math.abs(x)){md=0;return}dg=1;cu=Sl[i];W=innerWidth;cl()}
dx=x;const nb=Sl[dx<0?i+1:i-1];
if(pk&&pk!==nb){hide(pk);pk=null}
if(nb&&!pk){pk=nb;nb.scrollTop=0;nb.classList.add('pk');nb.style.transition='none'}
cu.style.transition='none';cu.style.transform='translateX('+(nb?dx:dx/3)+'px)';
if(pk)pk.style.transform='translateX('+(dx+(dx<0?W:-W))+'px)'},{passive:true});
function end(e,cancel){if(md!==1||!dg){md=0;return}
md=0;dg=0;sk=Date.now();busy=true;
const c=cu,n=pk,dir=dx<0?1:-1,v=Math.abs(dx)/Math.max(1,Date.now()-t0),tr='transform .26s cubic-bezier(.2,.7,.2,1)',ok=!cancel&&n&&(Math.abs(dx)>W*.28||(v>.45&&Math.abs(dx)>30));
pk=null;c.style.transition=tr;if(n)n.style.transition=tr;
if(ok){c.style.transform='translateX('+(-dir*W)+'px)';n.style.transform='translateX(0)';setTimeout(()=>{fin(c,n,i+dir);busy=false},270)}
else{c.style.transform='translateX(0)';if(n)n.style.transform='translateX('+(dir*W)+'px)';setTimeout(()=>{c.style.transition='';c.style.transform='';if(n)hide(n);busy=false},270)}}
document.addEventListener('touchend',e=>end(e,false));
document.addEventListener('touchcancel',e=>end(e,true));
document.addEventListener('click',e=>{if(Date.now()-sk<400){e.stopPropagation();e.preventDefault()}},true);
let wl=0;addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&Date.now()-wl>500&&Math.abs(e.deltaX)>30){wl=Date.now();go(i+(e.deltaX>0?1:-1))}},{passive:true});
go(0);

</script>
</body>
